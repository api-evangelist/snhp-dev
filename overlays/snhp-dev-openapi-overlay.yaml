overlay: 1.0.0
info:
  title: API Evangelist enhancements for Game Theory Layer for AI Agents (SNHP)
  version: 1.0.0
  description: 'Overlay generated 2026-09-19 (method: generated). Adds what the served OpenAPI omits and the provider
    documents elsewhere: servers, the two documented API-key schemes applied to the 25 key-gated operations, the
    7 undeclared tag names, the documented 429 with Retry-After, the observed 402 problem+json body, the one idempotent
    write, the GDPR operations, the MPP/AP2 domain-standard markers, and the MCP tool / agent-card skill bindings.
    Applies to openapi/snhp-dev-openapi.yml; never mutates openapi/_original/.'
extends: openapi/snhp-dev-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist:
      profiled: '2026-09-19'
      repo: https://github.com/api-evangelist/snhp-dev
      note: Enhancements proposed by API Evangelist; the served document at https://snhp.dev/openapi.json is unmodified
        in openapi/_original/.
- target: $
  update:
    servers:
    - url: https://snhp.dev
      description: Primary host (identical on api.snhp.dev, www.snhp.dev, snhp.fly.dev) — the served spec declares
        no servers[]; stated in llms.txt and /.well-known/agents.json http_base
- target: $.components
  update:
    securitySchemes:
      BearerKey:
        type: http
        scheme: bearer
        bearerFormat: gt_*
        description: Self-issued key from POST /v1/keys. Sending it as a header moves the caller from the 60/min-per-IP
          floor to the 600/min-per-key lane.
      XApiKey:
        type: apiKey
        in: header
        name: X-API-Key
        description: Equivalent to BearerKey.
- target: $
  update:
    tags:
    - name: billing
      description: Wallet funding (Stripe Checkout, agentic top-up, inbound Stripe webhook) and balance
    - name: helper
      description: Rent-renewal situation helper (free, no key) and its privacy disclosure
    - name: mpp
      description: 'Machine Payments Protocol: manifest + SPT top-up (402 challenge flow)'
    - name: notary
      description: Receipt notary public key and standalone receipt verification
    - name: rent
      description: Rent-renewal market data and offer check
    - name: store
      description: 'The prepaid counter: catalog, notary key, demand box, blind locker park/retrieve, observatory'
    - name: vend
      description: Vending-machine quotes and settlement
  description: Declare the 7 tag names operations already use but the root tags[] omits
