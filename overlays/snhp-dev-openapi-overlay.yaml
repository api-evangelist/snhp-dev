- target: $.paths['/v1/mpp/topup'].post
  update:
    x-domain-standard: MPP (Machine Payments Protocol) — Stripe Shared Payment Token; manifest at GET /v1/mpp/manifest
- target: $.paths['/v1/negotiate/turn'].post
