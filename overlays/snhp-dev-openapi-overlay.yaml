- target: $.paths['/v1/mpp/topup'].post.responses['402']
  update:
    content:
      application/problem+json:
        schema:
          type: object
          properties:
            type:
              type: string
              const: https://paymentauth.org/problems/payment-required
            title:
              type: string
            status:
              type: integer
              const: 402
            detail:
              type: string
            challengeId:
              type: string
            price_cents:
              type: integer
            base_cents:
              type: integer
            fee_cents:
              type: integer
            counter_fee_pct:
              type: integer
    headers:
      WWW-Authenticate:
        schema:
          type: string
        description: Payment id="...", realm="snhp.dev", method="stripe", intent="charge", request="<base64 challenge>",
          description="...", expires="<ISO 8601>" — observed live 2026-09-19
      Accept-Payment:
        schema:
          type: string
          const: stripe
  description: Body and headers observed on the live 402; the served spec declares the status with empty content
- target: $.paths['/v1/keys'].post
  update:
    x-idempotent: true
    x-idempotency-key: agent_id (natural key, 24-hour window)
    x-idempotency-note: The only idempotent write in the API per the operation description.
- target: $.paths['/v1/telemetry/delete'].delete
  update:
    x-data-subject-right: GDPR Article 17 erasure
    x-window: 78 weeks of week-hashes
- target: $.paths['/v1/telemetry/export'].get
  update:
