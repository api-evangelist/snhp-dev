- target: $.paths[*][?(@.operationId=='negotiate_turn_endpoint_v1_negotiate_turn_post')].responses
  update:
    '429': &id001
      description: 'Too Many Requests — documented token bucket: 60/min per IP keyless, 600/min per key (header
        only), 10/hour per IP on POST /v1/keys. Always carries Retry-After (whole seconds).'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Whole seconds until a token frees up.
