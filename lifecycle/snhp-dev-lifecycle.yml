    Renamed MCP tools survive as aliases on the pro door: gt_negotiate_turn, gt_negotiate_bundle,
    gt_auction_optimal_bid, gt_auction_optimal_reserve, gt_mechanism_posted_price_optimal,
    gt_mechanism_gale_shapley, store_park, store_retrieve, nextmove_open, nextmove_advise,
