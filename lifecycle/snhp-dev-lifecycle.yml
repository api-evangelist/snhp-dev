summary: >-
  A pre-1.0 single-deployment service that says so in machine-readable form: GET /v1/catalog
  returns sla {level: best-effort, uptime_guarantee: null, self_hostable: true} and the text "No
  uptime SLA today (single deployment) — best-effort. The core math is deterministic and
  self-hostable, so you can depend on no one. A real 99.9%-with-credits commitment comes only with
  redundant infra." There is no status page (status.snhp.dev does not resolve; /status 404s), no
  deprecation policy and no Sunset/Deprecation headers — but there IS a de facto deprecation
  practice: 12 legacy gt_* MCP tool names are kept alive on the /mcp/pro/ door, each self-described
  as "Alias of <new name>", with no removal date. The dated changelog lives in the repository
  (gametheory/CHANGELOG.md, last entry 2026-05-02) and is not served on the site; a ChangeLog
  pointer to the GitHub file is emitted. No StatusPage or Deprecation pointer is emitted.
