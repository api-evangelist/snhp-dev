summary: >-
  Limits are published precisely and in three places (llms.txt "Cost model", the key-issuance
  operation's own description, and the negotiate/turn description): an in-memory token bucket per
  single instance giving 60 requests/min per IP to keyless callers, 600/min per key to callers who
  send a gt_* key in a HEADER (a key in the request body "does NOT raise your limit"), 10/hour per
  IP on key issuance, and — for the opt-in LLM dispute routes — 40/hour per IP plus a persistent
  $5/day spend cap. The runtime signal is a 429 that "always carries Retry-After (whole seconds
  until a token frees up)". No RateLimit-* or X-RateLimit-* headers were observed on a live 200
  and the OpenAPI declares no 429 on any operation. The issued key's response carries
  rate_limit_per_minute: 600 as a field.
limit_count: 5
