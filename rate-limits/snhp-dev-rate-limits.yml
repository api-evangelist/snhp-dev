implementation_reading: 'Per-instance in-memory buckets on a single deployment: limits are not shared across instances and reset on restart. The provider states both facts.'
mcp_note: 'No separate limit is published for the MCP doors; the paid MCP tools take the same gt_* key as an argument, and the HTTP limiter "only reads headers", so whether an MCP call rides the 60/min or 600/min lane is not stated.'
agent_guidance: >-
  Issue a key once (POST /v1/keys, idempotent on agent_id for 24h) and send it in Authorization:
  Bearer — that alone multiplies the ceiling by 10. On 429 sleep exactly Retry-After seconds. Do
  not put the key in the body expecting a higher lane.
