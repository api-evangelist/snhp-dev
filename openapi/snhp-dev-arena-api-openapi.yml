openapi: 3.2.0
info:
  title: SNHP Evolution Arena API
  description: watch AI negotiators evolve, live
  version: 0.1.0
tags:
- name: Arena
paths:
  /arena/state:
    get:
      summary: State
      operationId: state_arena_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response State Arena State Get
      tags:
      - Arena
  /arena/census:
    get:
      summary: Census
      operationId: census_arena_census_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Census Arena Census Get
      tags:
      - Arena
  /arena/species:
    get:
      summary: Species
      operationId: species_arena_species_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Species Arena Species Get
      tags:
      - Arena
  /arena/agents/{agent_id}:
    get:
      summary: Agent
      operationId: agent_arena_agents__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Agent Arena Agents  Agent Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Arena
  /arena/highlights:
    get:
      summary: Highlights
      operationId: highlights_arena_highlights_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Highlights Arena Highlights Get
      tags:
      - Arena
  /arena/replay:
    get:
      summary: Replay
      operationId: replay_arena_replay_get
      parameters:
      - name: gen
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          title: Gen
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Arena
  /arena/stats:
    get:
      summary: Stats
      description: 'The science/skeptic payload: honest claims + the config a viewer can read.'
      operationId: stats_arena_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Stats Arena Stats Get
      tags:
      - Arena
  /arena/champion:
    post:
      summary: Champion
      description: 'Queue a viewer-forged champion. It enters through the gate at the next

        generation boundary as a real agent running the viewer''s SNHP parameters.'
      operationId: champion_arena_champion_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChampionReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Champion Arena Champion Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Arena
  /arena/admin/{action}:
    post:
      summary: Admin
      operationId: admin_arena_admin__action__post
      parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          title: Action
      - name: token
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Admin Arena Admin  Action  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Arena
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ChampionReq:
      properties:
        token:
          type: string
          maxLength: 64
          title: Token
        house:
          type: string
          maxLength: 24
          title: House
          default: Challenger
        tactic:
          type: string
          maxLength: 16
          title: Tactic
        boldness:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Boldness
          default: 0.6
        bluff:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Bluff
          default: 0.3
        patience:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Patience
          default: 0.5
        staked:
          type: boolean
          title: Staked
          default: false
      type: object
      required:
      - token
      - tactic
      title: ChampionReq
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
