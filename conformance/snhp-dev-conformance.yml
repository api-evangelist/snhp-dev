domain_standard_note: >-
  The provider's market is agent-to-agent commerce; the standards that market is converging on are
  MPP (agent-native payment) and AP2 (agent-authorised settlement records), and this contract
  declares both — x-payment-info + the WWW-Authenticate: Payment challenge for MPP, and AP2
  Cart/Intent mandates with a published verification key for settlement. Recorded as
  domain_standard: true on those two rows with the exact spec locations above.
compliance_program: none
compliance_note: 'No SOC 2 / ISO 27001 / PCI / HIPAA / FedRAMP claim anywhere; no trust page (probe-security-programs.py: trust=none). No Compliance pointer is emitted. Card data never touches the provider: Stripe Checkout and Stripe Shared Payment Tokens ("the store never sees the card, only redeems a scoped token" — /v1/mpp/manifest).'
