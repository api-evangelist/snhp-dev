      - path: /apis.yml
        status: 404
      - path: /.well-known/jwks.json
        status: 404
        note: Not on the named list; probed because the API issues EdDSA-signed JWTs. Keys are published instead at GET /v1/keys/trust_anchor, /v1/keys/settlement_notary and /v1/store/notary_pubkey (all 200).
