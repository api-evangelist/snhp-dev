  - {name: session_bundle, door: core, paid: false, annotations: write, description: 'Multi-issue logrolled move inside a receipted session.', source_operation: 'openapi/snhp-dev-openapi.yml#advice_bundle_move_v1_advice_bundle_post'}
  - {name: session_close, door: core, paid: false, annotations: idempotent-write, description: 'Close the session and get the signed summary receipt.', source_operation: 'openapi/snhp-dev-openapi.yml#close_advice_session_v1_advice_close_post'}
