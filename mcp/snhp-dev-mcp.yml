    remote: https://api.snhp.dev/mcp/
    source: https://registry.modelcontextprotocol.io/v0/servers?search=snhp
    note: Two versions listed (0.3.0 and 0.4.0, both 2026-07-23, status active); the repository ships server.json with the 0.4.0 entry. The server card's own `name` is io.github.ryuxik/snhp-negotiation, which does not match the registry name.
  smithery: {url: 'https://smithery.ai/servers/ryuxik/snhp', status: 200, note: 'stdio listing; smithery.yaml in the repo runs `uvx snhp`'}
  glama: {note: 'glama.json in the repo names maintainer ryuxik'}
annotations_note: >-
  The core door annotates every tool: the seven math tools and memory_load / store_catalog are
  readOnlyHint true; memory_save, session_open, session_advise, session_bundle and store_request
  are readOnlyHint false, destructiveHint false, idempotentHint false; session_close is
  idempotentHint true. All are openWorldHint false. The 39 pro-only tools carry no annotations.
tools:
  - {name: negotiate, door: core, paid: false, annotations: read-only, description: 'Your math-optimal next move in any price negotiation — free, no account or key needed.', source_operation: 'openapi/snhp-dev-openapi.yml#negotiate_turn_endpoint_v1_negotiate_turn_post'}
  - {name: negotiate_bundle, door: core, paid: false, annotations: read-only, description: 'Negotiate several linked issues at once by logrolling — free.', source_operation: 'openapi/snhp-dev-openapi.yml#negotiate_bundle_endpoint_v1_negotiate_bundle_post'}
  - {name: score_deal, door: core, paid: false, annotations: read-only, description: 'Score a deal against the Pareto frontier (the certificate test''s oracle as a callable tool).', source_operation: null}
  - {name: auction_bid, door: core, paid: false, annotations: read-only, description: 'Optimal auction bid (first-price, Vickrey, English).', source_operation: 'openapi/snhp-dev-openapi.yml#auction_bidder_optimal_bid_v1_auction_bidder_optimal_bid_post'}
  - {name: auction_reserve, door: core, paid: false, annotations: read-only, description: 'Revenue-optimal reserve price (Myerson).', source_operation: 'openapi/snhp-dev-openapi.yml#auction_seller_optimal_reserve_v1_auction_seller_optimal_reserve_post'}
  - {name: clearance_price, door: core, paid: false, annotations: read-only, description: 'Clearance price and markdown schedule (Gallego-van Ryzin posted price).', source_operation: 'openapi/snhp-dev-openapi.yml#mechanism_posted_price_optimal_v1_mechanism_posted_price_optimal_post'}
  - {name: stable_match, door: core, paid: false, annotations: read-only, description: 'Stable matching (Gale-Shapley deferred acceptance).', source_operation: 'openapi/snhp-dev-openapi.yml#mechanism_gale_shapley_v1_mechanism_gale_shapley_post'}
  - {name: memory_save, door: core, paid: true, annotations: write, description: 'Save agent memory (blind locker) — flat park fee from the prepaid wallet; retrieval free.', source_operation: 'openapi/snhp-dev-openapi.yml#memory_save_v1_memory_save_post'}
  - {name: memory_load, door: core, paid: false, annotations: read-only, description: 'Load agent memory by ticket.', source_operation: 'openapi/snhp-dev-openapi.yml#memory_load_v1_memory_parcel__ticket__get'}
  - {name: session_open, door: core, paid: true, annotations: write, description: 'Open a $2 receipted, deterministic negotiation session (cap 10 moves, 7 days).', source_operation: 'openapi/snhp-dev-openapi.yml#open_advice_session_v1_advice_session_post'}
