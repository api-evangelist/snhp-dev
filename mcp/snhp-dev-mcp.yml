method: probed
status: published
source: https://snhp.dev/mcp/
checked: '2026-09-19'
summary: >-
  SNHP runs a live, hosted, streamable-HTTP MCP server with TWO doors on the same application:
  the CORE door at https://snhp.dev/mcp/ (15 "hero-first" tools) and the PRO door at
  https://snhp.dev/mcp/pro/ (54 tools — the same 15 plus 39 legacy gt_* names, the verified-peer
  A2A flow, first-strike attestation, auction design/simulation, the offer-graph engine and
  "pondering" sessions). Both completed the initialize handshake (protocolVersion 2025-06-18,
  serverInfo gametheory / gametheory-pro, version 1.28.1) with no credentials, answered tools/list
  cold — no session id required — with real tools carrying inputSchema and (core door) annotations,
  and a read-only tools/call of store_catalog succeeded anonymously. resources/list and
  prompts/list are empty. The identical server also answers on api.snhp.dev/mcp/ (the host the
  official MCP registry names), www.snhp.dev and snhp.fly.dev. A stdio twin ships on PyPI as
  `snhp` (`uvx snhp`), listed on Smithery and Glama, so the deployment mode is BOTH.
deployment:
  mode: both
  endpoint: https://snhp.dev/mcp/
  endpoint_pro: https://snhp.dev/mcp/pro/
  endpoint_aliases:
    - https://api.snhp.dev/mcp/        # named by the official MCP registry entry
    - https://www.snhp.dev/mcp/
    - https://snhp.fly.dev/mcp/
  install: uvx snhp
  install_alternatives:
    - pip install snhp && snhp
    - pip install snhp && gametheory-mcp
  package: https://pypi.org/project/snhp/
  package_version: 0.2.0
  package_published: '2026-07-10'
  client_config_verbatim: '{ "mcpServers": { "snhp": { "command": "uvx", "args": ["snhp"] } } }'
  auth: none
  auth_note: >-
    The server card declares authentication {required: false, schemes: []} and no credential,
    challenge or WWW-Authenticate was seen on initialize, tools/list, resources/list, prompts/list
    or the read-only store_catalog call. The seven free math tools take no key at all. The paid
    tools (memory_save, session_open/advise/bundle/close, store_request with watch) take a gt_*
    api_key as a TOOL ARGUMENT — an application-level key inside the JSON-RPC params, not a
    transport credential — and the key itself is issued with no human by POST /v1/keys. No
    /.well-known/oauth-protected-resource is served (well-known/). No mutating tool was called.
  verified: probed
  probe:
    initialize:
      request: 'POST https://snhp.dev/mcp/ {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18",...}}'
      accept: application/json, text/event-stream
      status: 200
      content_type: text/event-stream
      session_header: none issued
      credentials_sent: none
      raw: snhp-dev-mcp-initialize.json
    tools_list_core:
      request: 'POST https://snhp.dev/mcp/ tools/list (cold, no prior initialize)'
      status: 200
      tool_count: 15
      raw_manifest: snhp-dev-mcp-tools.json
    tools_list_pro:
      request: 'POST https://snhp.dev/mcp/pro/ tools/list (cold)'
      status: 200
      tool_count: 54
      raw_manifest: snhp-dev-mcp-pro-tools.json
    tools_call_read_only:
      request: 'POST tools/call {"name":"store_catalog","arguments":{}}'
      status: 200
      isError: false
      note: Returned the same JSON as GET /v1/store/catalog (unit, counter_fee, starter_credit, slots[], receipts block).
    resources_list: {status: 200, count: 0}
    prompts_list: {status: 200, count: 0}
    session_required: false
    session_note: >-
      A cold tools/list with no session succeeds, unlike servers that demand initialize first; the
      transport is stateless streamable-HTTP framed as SSE ("event: message" lines).
    checked: '2026-09-19'
server:
  name: gametheory
  name_pro: gametheory-pro
  title: SNHP — free negotiation math + agent memory
  version: 1.28.1
  version_note: 'serverInfo.version 1.28.1 tracks the Python `mcp` SDK (pyproject pins mcp>=1.27); the product version is 0.1.0 (server card, /health, OpenAPI) and the PyPI package is 0.2.0.'
  protocol_version: '2025-06-18'
  transport: streamable-http
  url: https://snhp.dev/mcp/
  capabilities:
    tools: {listChanged: false}
    resources: {listChanged: false, subscribe: false}
    prompts: {listChanged: false}
    experimental: {}
  resources: 0
  prompts: 0
  instructions: >-
    Verbatim from initialize: "Free, one-call negotiation math for agents — no account, no key.
    START WITH `negotiate` (your math-optimal next move in any price haggle) or `negotiate_bundle`
    (several linked issues at once, logrolled); `score_deal`, `auction_bid`, `auction_reserve`,
    `clearance_price`, and `stable_match` round out the free math. When you need it ON THE RECORD,
    `session_open` opens a $2 receipted, replayable negotiation session (then session_advise /
    session_bundle / session_close). When your agent needs to REMEMBER, `memory_save` /
    `memory_load` are persistent cross-session memory — you encrypt before saving; the store holds
    only ciphertext (blind custody) and cannot read it. `store_catalog` shows the shelf and your
    balance; `store_request` files what we don't stock yet. Empirical anchor: the negotiate
    recommender is ~12% better head-to-head (n=20 paired LLM negotiations, p<0.0001). Power users:
    the FULL surface (verified agent-to-agent + AP2 settlement, first-strike attestation, auction
    design/sim, offer-graph engine, legacy names) is the pro door at /mcp/pro/."
  server_card: ../well-known/snhp-dev-mcp-server-card.json
  server_card_url: https://snhp.dev/.well-known/mcp/server-card.json
  raw_initialize: snhp-dev-mcp-initialize.json
  raw_manifest: snhp-dev-mcp-tools.json
  raw_manifest_pro: snhp-dev-mcp-pro-tools.json
