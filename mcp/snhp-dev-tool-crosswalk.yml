mcp_only:
- tool: score_deal
  door: core
  reason: Pareto-frontier deal scoring (issues, my_weights, their_weights, package, notional). agents.json lists
    it with an mcp_tool and NO endpoint; no REST operation scores a package. The certificate gauntlets scoring oracle
    exposed as a tool.
- tool: gt_a2a_build_peer_proof
  door: pro
  reason: Step 1 of the A2A flow signs a per-negotiation proof with the operator PRIVATE key; the provider says
    the key never leaves the process and to run the MCP server on your own host. Deliberately not a REST operation.
- tool: gt_negotiate_open_session
  door: pro
  reason: '"Pondering" sessions: stateful server-side speculation over likely counter-offers between turns. No REST
    twin in the spec (the /v1/advice/* sessions are the paid receipted product, a different thing).'
- tool: gt_negotiate_propose
  door: pro
  reason: Pondering session move; no REST twin.
- tool: gt_negotiate_respond
  door: pro
  reason: Pondering session response; no REST twin.
- tool: gt_negotiate_close_session
  door: pro
  reason: Pondering session close; no REST twin.
