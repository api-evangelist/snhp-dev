method: derived
source: mcp/snhp-dev-mcp-tools.json (live tools/list from https://snhp.dev/mcp/, 15 tools) and mcp/snhp-dev-mcp-pro-tools.json
  (live tools/list from https://snhp.dev/mcp/pro/, 54 tools), bound against openapi/snhp-dev-openapi.yml (live from
  https://snhp.dev/openapi.json, 74 operations). Bindings taken first from the providers own /.well-known/agents.json
  free_tools[] (endpoint + mcp_tool pairs), then from tool descriptions that declare themselves aliases, then by
  schema identity; every operationId below was verified to exist in the spec by the script that wrote this file.
summary: 'One engine, three projections. The core MCP door is a curated 15-tool subset in which 14 tools bind to
  REST operations at high confidence and one (score_deal) has no REST twin. The pro door adds 39 tools: 34 bind
  to REST (28 high, 1 medium), 12 of them are explicit "Alias of" legacy names for core tools, and 5 are MCP-only
  — the local peer-proof signer and four "pondering" session tools that keep server-side state between turns. Of
  74 REST operations, 38 are reachable through some MCP tool and 36 are REST-only: key issuance and rotation, billing/top-up
  and the Stripe webhook, the MPP payment endpoints, the vend quote/settle pair, offer_compile, notary key/verify,
  store_fetch and the observatory, advice_request, the dispute prototype, the three GDPR telemetry operations, the
  rent helper and the situation helper, and the discovery documents. Notably an agent CANNOT mint a key or fund
  a wallet over MCP — the paid tools take a gt_* key as an argument that must first be issued over HTTP (POST /v1/keys).'
