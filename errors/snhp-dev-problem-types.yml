- status: 429
  title: Too Many Requests
  declared: false
  documented: true
  headers:
  - 'Retry-After: <whole seconds until a token frees up> — "A 429 always carries Retry-After"'
  limits: 60/min per IP keyless; 600/min per key sent as a HEADER; POST /v1/keys 10/hour per IP; LLM dispute routes
    40/hour per IP and a $5/day cap ("Past the cap, calls 429").
  remediation: Sleep Retry-After seconds. To leave the 60/min floor, issue a key (POST /v1/keys) and send it in
    Authorization or X-API-Key — a key in the body does not raise the limit.
  source: https://snhp.dev/llms.txt "Cost model"; PRICING.md "Abuse resistance"
- status: 200
  title: Uncharged failure (business outcome under a success status)
  media_type: application/json
  shape: '{"ok": false, "charged": false, "reason": "<text>", "code": "<slug>"}'
  declared: false
  documented: true
  codes_named_in_docs:
  - insufficient_balance  (only a ZERO balance is refused on commodity slots)
  - expired  (memory_load on a past-TTL ticket)
  - at_rest_key_unavailable  (memory_load when the server-side at-rest key is missing)
  - 'found: false  (store_request_status on an unknown id)'
  remediation: Check `ok` on every paid call regardless of HTTP status. charged:false means the wallet did not move
    — safe to fix the input and retry.
  source: https://snhp.dev/llms.txt "Wallet, fee & the safety rule"; store_retrieve tool description; GET /v1/store/catalog
