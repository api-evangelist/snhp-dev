format: fastapi-detail (partial rfc9457)
summary: 'The spec declares only three error codes across 74 operations: 422 HTTPValidationError on 48 operations,
  400 "Invalid input" on one (sell-side next_offer, empty content), and 402 on one (MPP top-up, empty content).
  Nothing declares 401, 403, 404, 409, 429 or 5xx, although 404/405 were observed live, 429 is documented in prose
  with Retry-After, and missing credentials come back as 422 rather than 401. The one RFC 9457 response in the whole
  surface is the 402 payment challenge, which the spec under-describes. The most agent-relevant error is not an
  HTTP error at all: a failed PAID call returns HTTP 200 {ok:false, charged:false, reason, code}.'
