apis:
- aid: snhp-dev:game-theory-api
  name: SNHP Game Theory Layer API
  description: >-
    The hosted REST API on https://snhp.dev — 74 operations generated by FastAPI and served
    anonymously as OpenAPI 3.1.0 at /openapi.json (Swagger UI at /docs, ReDoc at /redoc). Free,
    keyless negotiation (POST /v1/negotiate/turn, /bundle), utility-space negotiation with
    first-strike attestation, auctions, mechanism design, the offer-graph engine, the verified-peer
    registry + A2A session + AP2 settle flow, self-serve key issuance (POST /v1/keys), the prepaid
    store (catalog, blind locker, demand box, observatory), billing by Stripe Checkout or MPP,
    receipted $2 advice sessions, opt-in telemetry with GDPR export/delete, a rent-renewal helper,
    and the discovery documents (/llms.txt, /v1/catalog, /.well-known/*). The served spec declares
    no servers[] and no securitySchemes; both are added in the refined copy and proposed in the
    overlay.
