aid: snhp-dev
name: SNHP
description: >-
  SNHP (snhp.dev, operated by gametheory.dev / github.com/ryuxik and listed in the a2aregistry.org
  harvest as "Negotiation Copilot for Agents") is free, LLM-free game-theory negotiation math for
  AI agents: a hosted FastAPI "Game Theory Layer" with 74 operations served anonymously as OpenAPI
  3.1 on snhp.dev that returns the math-optimal next move in a single-price or multi-issue
  negotiation in plain dollars, plus auction bidding and reserve pricing, mechanism design
  (Gale-Shapley, Myerson, posted-price clearance), a cryptographic first-strike commitment, and a
  verified-peer agent-to-agent flow that settles into signed AP2 Cart/Intent mandates. The same
  engine is exposed as a live streamable-HTTP MCP server with a 15-tool core door and a 54-tool pro
  door (listed in the official MCP registry and on Smithery), as a stdio server and Python library
  on PyPI (snhp, Apache-2.0), and behind an A2A agent card at the canonical well-known path. The
  core math is free with no key; a self-issued gt_* key unlocks a prepaid millicent wallet — funded
  by Stripe Checkout or agent-natively by the Machine Payments Protocol (Stripe Shared Payment
  Tokens) — that buys $2 receipted deterministic negotiation sessions and blind-custody encrypted
  agent memory, every settled call returning an Ed25519-signed receipt verifiable offline. A second
  application, the Evolution Arena on arena.snhp.dev, publishes its own OpenAPI for the live
  strategy-evolution sim, the gauntlet certificate and the PAR game. Single deployment, best-effort
  SLA stated in the API itself, no legal pages, GDPR access/erasure exposed as API operations.
