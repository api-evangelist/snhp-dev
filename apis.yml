- aid: snhp-dev:evolution-arena-api
  name: SNHP Evolution Arena API
  description: >-
    A separate FastAPI application on https://arena.snhp.dev ("SNHP Evolution Arena — watch AI
    negotiators evolve, live") with 31 operations served anonymously as OpenAPI 3.1.0 at
    /openapi.json (Swagger UI at /docs): the always-on evolution sim (state, census, species,
    agents, highlights, replay, stats, champion), the snhp-gauntlet/1 certificate leaderboard and
    submission surface, the PAR daily negotiation game (today, house_move, grade, submit, stats,
    groups, advise, bundle_move), the divorce-settlement demo and a hit counter. Its llms.txt
    documents the snhp-gauntlet/1 bot protocol. No MCP, no agent card, no key scheme declared.
  humanURL: https://arena.snhp.dev/docs
  baseURL: https://arena.snhp.dev
