- aid: snhp-dev:mcp-server
  name: SNHP MCP Server
  description: >-
    Hosted streamable-HTTP MCP server (protocol 2025-06-18) with two doors on the same application:
    the core door https://snhp.dev/mcp/ (15 annotated tools — negotiate, negotiate_bundle,
    score_deal, auction_bid, auction_reserve, clearance_price, stable_match, memory_save,
    memory_load, session_open/advise/bundle/close, store_catalog, store_request) and the pro door
    https://snhp.dev/mcp/pro/ (54 tools adding the legacy gt_* names, the verified-peer A2A flow,
    first-strike attestation, auction design/sim, the offer-graph engine and pondering sessions).
    Both answer initialize and tools/list with no credentials and no session; paid tools take a
    gt_* key as a tool argument. Listed in the official MCP registry as io.github.ryuxik/snhp
    (remote https://api.snhp.dev/mcp/) and on Smithery; a stdio twin runs with `uvx snhp`. Serves
    an MCP server card at /.well-known/mcp/server-card.json.
  humanURL: https://github.com/ryuxik/snhp
  baseURL: https://snhp.dev/mcp/
