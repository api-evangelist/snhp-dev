source: openapi/snhp-dev-openapi.yml components.schemas (78 schemas) — $ref edges and id-shaped fields; operation
  requestBody bindings. Response schemas are untyped objects in the served spec, so response-side entities come
  from the providers prose (llms.txt, /v1/catalog example_output, store catalog).
summary: 'Not a CRUD resource model: the 78 schemas are almost all REQUEST bodies for stateless math (negotiation,
  auction, mechanism, offer-graph) plus a handful of stateful objects the API mints and refers to by opaque id —
  an API KEY (gt_*) that owns a WALLET (millicents) and TELEMETRY rows (per-week HMAC hashes), a receipted SESSION
  (session_id, moves, context_hash), a locker TICKET (parked ciphertext with TTL), a demand-box REQUEST (request_id),
  a first-strike COMMITMENT (commitment_id), a RECOMMENDATION (rec_*, for outcome reporting), an OPERATOR identity
  (operator_id, attestation JWT, verification_level self|domain) and a verified-peer SESSION that yields an AP2
  Cart/Intent MANDATE. Because every 200 response is declared as an untyped object, the response-side shapes (receipt,
  wallet, mandate) are known only from prose and examples; the composed request objects (MenuSpec -> DimSpec ->
  OptionSpec; QuoteRequest -> BuyerSpec/MenuSpec/StateSpec; OpenSessionRequest -> PeerProof x2; GaleShapleyRequest
  -> Proposer[]/Receiver[]) are the only $ref graph.'
