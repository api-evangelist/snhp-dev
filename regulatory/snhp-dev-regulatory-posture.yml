    substance: 'request_privacy (keyed hash of each request, no browsable history); locker privacy ("BLIND by construction: you encrypt BEFORE parking, we store ciphertext only and never decrypt, inspect, parse, or log it"); acceptable_use for the fetch slot (public-web only, no credentialed fetching, IP-literal/localhost refused).'
  note: 'Recorded because they are real, dated-by-fetch privacy commitments; none of them is a privacy policy page, none names a controller, and none of them is a signal in the canonical list above.'
