summary: >-
  No legal pages at all — /terms, /privacy, /legal, /accessibility, /transparency, /trust,
  /legal/subprocessors, /legal/dpa and /privacy/requests all 404, and the homepage links to none.
  What the provider publishes instead is privacy-by-API: two GDPR operations declared in the
  OpenAPI and documented as applying "regardless of EU residence" (DELETE /v1/telemetry/delete —
  Article 17, sweeps 78 weeks; GET /v1/telemetry/export — Article 15), an opt-in-only telemetry
  design with a published list of what is and is not stored, a per-tool privacy disclosure
  endpoint for the rent helper (GET /v1/helper/privacy: never stored / stored / bucketed fields,
  a no-resale commitment, an opt-out flag), and a blind-custody statement for agent memory. One
  signal carries substance — a data-subject-request API — and it is recorded with the exact spec
  location. Everything else is absent and the probes say so.
