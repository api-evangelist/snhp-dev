  items:
  - source: https://snhp.dev/llms.txt
    section: Telemetry (opt-in, off by default)
    substance: 'Default collects nothing; two gates (issuance consent + per-call share_outcome) must both be true; stored = per-week HMAC key hash truncated to 128 bits, features quantized to a 0.02 grid, lists capped at 16, allowlisted vertical enum; NOT stored = wall-clock timestamps, raw key, free text, IP, user agent, request metadata.'
  - source: https://snhp.dev/v1/helper/privacy
    status: 200
    substance: 'For the rent-renewal helper: enabled: false at probe time; never_stored[] (own-words description, exact figures, address/name/email/phone, IP/UA/referrer, cookies/accounts, timestamps finer than month), stored[] and bucketed_fields[] enumerated; commitment "We do not attempt to reidentify anyone ... do not sell it ... do not share it with data brokers or advertisers"; opt_out "Send no_telemetry: true with any request"; a not_advice disclaimer.'
  - source: https://snhp.dev/v1/store/catalog
